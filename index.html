* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
header {
  padding:22px 16px 18px;
  background:linear-gradient(135deg,#142a43,#111522 72%);
  border-bottom:1px solid var(--border);
}
.brand {
  color:var(--blue);
  font-size:11px;
  letter-spacing:3px;
  font-weight:800;
}
h1 { margin:8px 0; font-size:28px; }
header p { color:var(--muted); font-size:13px; margin:0; }
.status {
  display:inline-block;
  margin-top:12px;
  padding:6px 9px;
  border:1px solid #284d48;
  border-radius:8px;
  color:var(--green);
  font-size:11px;
}
.search { padding:14px 12px 3px; }
input,select {
  width:100%;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  outline:none;
}
input:focus,select:focus { border-color:var(--blue); }
.section-label {
  padding:18px 13px 10px;
  font-size:12px;
  color:var(--muted);
  font-weight:bold;
  letter-spacing:1px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:0 12px;
}
.card {
  min-width:0;
  min-height:108px;
  text-align:left;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
}
.card:active,.action:active { background:var(--panel2); }
.emoji { display:block; font-size:25px; margin-bottom:10px; }
.card strong { display:block; font-size:13px; line-height:1.35; }
.card small { display:block; color:var(--muted); margin-top:5px; font-size:11px; }
main, #detail { padding-bottom:30px; }
#detail { display:none; padding:14px; }
#detail h2 { font-size:23px; margin:14px 0 8px; }
.subtitle { color:var(--muted); font-size:13px; line-height:1.5; }
.box {
  margin:10px 0;
  padding:14px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  line-height:1.55;
  overflow-wrap:anywhere;
}
.box h3 { font-size:15px; margin:0 0 8px; }
.box p { font-size:13px; margin:6px 0; }
.muted { color:var(--muted); }
.tag {
  display:inline-block;
  color:var(--blue);
  border:1px solid #244b6a;
  padding:3px 7px;
  border-radius:7px;
  font-size:10px;
  margin:2px 3px 2px 0;
}
.action {
  width:100%;
  display:block;
  text-align:left;
  margin-top:9px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  text-decoration:none;
  font-size:13px;
}
.primary {
  background:var(--blue);
  color:#07111e;
  border:0;
  text-align:center;
  font-weight:bold;
}
.gold { color:var(--gold); }
footer {
  padding:22px 12px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}
.hidden { display:none !important; }
.two-col {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.two-col .action { margin:0; }
hr { border:0; border-top:1px solid var(--border); margin:14px 0; }
</style>

function cardHTML(s) {
  return `<button class="card" data-name="${s[1].toLowerCase()}"
    onclick="openSection('${s[3]}')">
    <span class="emoji">${s[0]}</span>
    <strong>${s[1]}</strong>
    <small>${s[2]}</small>
  </button>`;
}
document.getElementById("grid").innerHTML = sections.map(cardHTML).join("");

function filterCards() {
  const q = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("hidden", !c.dataset.name.includes(q));
  });
}

function showHome() {
  document.getElementById("home").style.display = "block";
  document.getElementById("detail").style.display = "none";
  document.getElementById("search").value = "";
  filterCards();
  window.scrollTo(0,0);
}

function box(title, text) {
  return `<div class="box"><h3>${title}</h3><p>${text}</p></div>`;
}
function linkButton(label,url) {
  return `<a class="action" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function searchPage(base,query) {
  if (!query.trim()) return;
  window.open(base+encodeURIComponent(query),"_blank");
}
function searchForm(base,placeholder) {
  return `<form onsubmit="event.preventDefault();searchPage('${base}',this.q.value)">
    <input name="q" placeholder="${placeholder}" required>
    <button class="action primary">🔎 Qidirish</button>
  </form>`;
}

function mapCards() {
  return maps.map((m,i)=>`
    <div class="box">
      <h3>${i+1}. ${m.name}</h3>
      <p>${m.side}</p>
      <button class="action" onclick="openMap(${i})">💣 Taktikalarni ochish</button>
    </div>`).join("");
}
function openMap(i) {
  const m=maps[i];

     <p class="subtitle">${m.side}</p>
     ${box("🧠 Umumiy taktika",m.plan)}

     ${box("⚡ Flashbang",m.flashes)}
     ${box("💥 HE grenade",m.he)}
     ${box("🔥 Molotov / Incendiary",m.molotov)}
     ${box("🎮 Practice",m.practice)}
     ${linkButton("▶️ Shu xarita bo‘yicha video qidirish",
       "https://www.youtube.com/results?search_query="+encodeURIComponent("CS2 "+m.name+" smoke flash molotov guide"))}
     <button class="action" onclick="openSection('maps')">← Xaritalarga qaytish</button>`;
  window.scrollTo(0,0);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(()=>alert("Kod nusxalandi!"))
      .catch(()=>alert("Nusxalash ishlamadi. Kodni qo‘lda belgilang."));
  } else {
    alert("Kod: \n"+text);
  }
}
